name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements-dev.txt
          pip install --no-deps --editable .
      - name: Lint
        run: ruff check src tests scripts
      - name: Test and coverage
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=75
      - name: Replay benchmark fixture
        run: |
          python scripts/build_evaluation_fixture.py
          git diff --exit-code -- fixtures/evaluation_cases.json
      - name: Validate claims and evidence identities
        run: python scripts/validate_evidence.py
      - name: Dependency audit
        run: pip-audit --requirement requirements.txt --progress-spinner off
      - name: Source security gate
        run: bandit --recursive src scripts --quiet --severity-level medium

  java-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install runtime
        run: |
          pip install --requirement requirements.txt
          pip install --no-deps --editable .
      - name: Compile accepted generated Java
        run: python scripts/compile_generated.py --require-compiler --output "$RUNNER_TEMP/java_compile.json"

  neo4j-integration:
    runs-on: ubuntu-latest
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${{ format('{0}Project10Ci!', github.run_id) }}
    services:
      neo4j:
        image: neo4j:5.26.29-community
        env:
          NEO4J_AUTH: ${{ format('neo4j/{0}Project10Ci!', github.run_id) }}
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: |
          pip install --requirement requirements-dev.txt
          pip install --no-deps --editable .
      - name: Wait for Neo4j
        run: python scripts/wait_for_neo4j.py
      - name: Verify live graph
        run: python scripts/verify_neo4j.py
      - name: Test Neo4j adapter
        env:
          RUN_NEO4J_INTEGRATION: "1"
        run: pytest tests/test_neo4j_live.py -q
      - name: Test Neo4j-backed MCP protocol
        env:
          MCP_TEST_GRAPH_BACKEND: neo4j
        run: pytest tests/test_mcp_protocol.py -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install MCP smoke client
        run: pip install --requirement requirements.txt
      - name: Build non-root image
        run: docker build --tag project10-mcp:ci .
      - name: Verify runtime identity
        run: test "$(docker run --rm --entrypoint id project10-mcp:ci -u)" = "65532"
      - name: Exercise MCP over container stdio
        run: python scripts/container_smoke.py docker run --rm -i project10-mcp:ci
