[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-mcp-code-intelligence"
version = "0.1.0"
description = "Reference implementation for graph-backed Java test generation workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Project Maintainer" }
]
dependencies = [
  "neo4j==5.15.0",
  "python-dotenv==1.0.0",
  "pandas==2.1.4",
  "toml==0.10.2",
  "GitPython==3.1.40",
  "tree-sitter==0.21.0",
  "tree-sitter-java==0.21.0",
  "jupyter==1.0.0",
  "ipykernel==6.27.1",
  "notebook==7.0.6",
  "openai==1.6.1",
  "sentence-transformers==2.2.2",
  "requests==2.31.0",
  "pyyaml==6.0.1",
  "colorama==0.4.6",
  "tqdm==4.66.1"
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.3",
  "black==23.12.1",
  "flake8==7.0.0"
]

[project.scripts]
graph-mcp-agent = "neo4j_agent:main"

[tool.setuptools]
py-modules = ["neo4j_agent"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]