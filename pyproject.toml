[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-mcp-code-intelligence"
version = "1.0.0"
description = "Graph-grounded MCP workflow for constrained Java test generation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Project Maintainer" }
]
dependencies = [
  "defusedxml==0.7.1",
  "mcp==1.29.0",
  "neo4j==6.2.0",
  "python-dotenv==1.2.2",
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5"
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "pillow==12.3.0",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1"
]

[project.scripts]
graph-mcp-agent = "neo4j_agent:main"
graph-mcp-server = "graph_mcp.server:main"

[tool.setuptools]
py-modules = ["neo4j_agent"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
